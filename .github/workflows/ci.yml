name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run depcruise
      - run: bun run layers
      - run: bun run build
      - name: マイグレーションがテーブル定義に追いついているか
        run: bun run db:generate && test -z "$(git status --porcelain)"

  # テストは DB を共有して1つずつ流すので、ファイル単位で2つのジョブに分けて同時に流す（各ジョブは別々の DB）。CUJ の E2E は2本
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # ブラウザ本体は Playwright の版ごとにキャッシュし、OS のライブラリだけ毎回入れる
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Playwright は packages/e2e の依存なので、そこで動かして同じ版のブラウザを入れる
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/e2e
        run: bunx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: packages/e2e
        run: bunx playwright install-deps chromium
      - run: bun run test:e2e --shard=${{ matrix.shard }}/2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: packages/e2e/test-results/

  # 見た目の配置のインテグレーション（Playwright、API は偽物）。backend を起動しないので E2E と分ける
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/frontend
        run: bunx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: packages/frontend
        run: bunx playwright install-deps chromium
      - run: bun run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-browser
          path: packages/frontend/test-results/

  # イメージがビルドできるかは、テストを待たずに確かめる。main ではこのビルドが image のキャッシュになる
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main への push のときだけ GHCR へ push する（mini-pc の Watchtower が latest を拾う）。
  # PR では何もしないが、必須チェックの image が check・e2e・browser・build-image の成功を待つ関所になる
  image:
    needs: [check, e2e, browser, build-image]
    runs-on: ubuntu-latest
    # 古いコミットのビルドが後から終わって latest を巻き戻さないよう、同じブランチでは順に実行する
    concurrency:
      group: image-${{ github.ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - if: github.event_name != 'push'
        run: echo "PR ではイメージを push しない"
      - if: github.event_name == 'push'
        uses: actions/checkout@v4
      - if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
