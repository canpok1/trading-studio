services:
  trading-studio:
    image: ghcr.io/canpok1/trading-studio:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
    # ホストの中からだけ受け付け、Tailscale Serve で tailnet 内へ中継する（ADR 0003・0004）
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
